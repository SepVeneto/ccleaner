[package]
name = "disk-sweeper"
version = "0.1.0"
description = "C 盘清理助手 - 目录大小可视化与安全清理"
authors = ["DiskSweeper"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "disk_sweeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
dirs = "6"
glob = "0.3"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
